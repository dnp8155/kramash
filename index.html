<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a8c4677eeb41482e947f9c6/99658306b_ChatGPTImageAug29202608_10_43PM.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a8c4677eeb41482e947f9c6/99658306b_ChatGPTImageAug29202608_10_43PM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kramasha" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://kramash.com" />

    <title>Kramasha — Business Management Software for Creative Businesses</title>
    <meta
      name="description"
      content="Manage clients, events, teams, services, quotations, invoices, payments and finances — all in one place. Built for photographers, event planners, studios and creative businesses."
    />
    <meta name="keywords" content="business management software, photography business management, event management software, photography CRM, photography invoicing, photography quotation software, team management, client portal, payment tracking, creative business management" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kramash.com" />
    <meta property="og:title" content="Kramasha — Business Management Software for Creative Businesses" />
    <meta
      property="og:description"
      content="Manage clients, events, teams, services, quotations, invoices, payments and finances — all in one place. Built for photographers, event planners, studios and creative businesses."
    />
    <meta property="og:site_name" content="Kramasha" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kramasha — Business Management Software for Creative Businesses" />
    <meta
      name="twitter:description"
      content="Manage clients, events, teams, services, quotations, invoices, payments and finances — all in one place."
    />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Kramasha",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Service business, team, project and financial management software for Photography, Event Management, Architecture and other service businesses.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Kramasha only for photographers and event businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Photography, Event Management and Architecture have ready-made workflows, while Other Service Business lets you configure your own roles, services and projects."
          }
        },
        {
          "@type": "Question",
          "name": "Can architects use Projects instead of Events?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Kramasha automatically adapts its terminology based on your business category, so Architecture workspaces use Projects, Project Sites and Project Teams."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Kramasha without GST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. GST is optional. Non-GST businesses can use quotations and financial features normally."
          }
        },
        {
          "@type": "Question",
          "name": "Does Kramasha support GST billing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kramasha supports optional GST in quotations, including CGST/SGST and IGST modes."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I downgrade my plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your existing business data isn't deleted if you downgrade. You keep all your clients, projects, quotations and financial records."
          }
        },
        {
          "@type": "Question",
          "name": "Is Kramasha a mobile app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kramasha is a responsive web application with PWA support and can be installed on supported devices."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded splash screen — shown instantly on app launch before React mounts.
           React replaces this content when the app is ready. -->
      <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F5F3EF;z-index:9999;">
        <style>
          @keyframes splash-fade-in {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
          }
          @keyframes splash-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
          }
          #app-splash-logo {
            width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
            animation: splash-fade-in 0.5s ease-out both;
          }
          #app-splash-logo img { width: 100%; height: 100%; object-fit: contain; }
          #app-splash-wordmark {
            margin-top: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: #1A1A1A;
            animation: splash-fade-in 0.5s ease-out 0.1s both;
          }
          #app-splash-spinner {
            margin-top: 28px; width: 28px; height: 28px;
            border: 3px solid #E8E3DB; border-top-color: #C8A95E;
            border-radius: 50%;
            animation: splash-spin 0.7s linear infinite;
          }
          @keyframes splash-spin { to { transform: rotate(360deg); } }
        </style>
        <div id="app-splash-logo">
          <img src="https://media.base44.com/images/public/6a8c4677eeb41482e947f9c6/99658306b_ChatGPTImageAug29202608_10_43PM.png" alt="Kramasha" />
        </div>
        <div id="app-splash-wordmark">Kramasha</div>
        <div id="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Fallback: remove splash screen after 6s even if React fails to mount
         (e.g., build error, network issue) so the user sees the real error. -->
    <script>
      window.setTimeout(function () {
        var s = document.getElementById('app-splash');
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, 6000);
    </script>
  </body>
</html>
