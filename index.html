    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Kramasha",

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Kramasha only for photographers and event businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Photography, Event Management and Architecture have ready-made workflows, while Other Service Business lets you configure your own roles, services and projects."
          }
        },
        {
          "@type": "Question",
          "name": "Can architects use Projects instead of Events?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Kramasha automatically adapts its terminology based on your business category, so Architecture workspaces use Projects, Project Sites and Project Teams."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Kramasha without GST?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. GST is optional. Non-GST businesses can use quotations and financial features normally."
          }
        },
        {
          "@type": "Question",
          "name": "Does Kramasha support GST billing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kramasha supports optional GST in quotations, including CGST/SGST and IGST modes."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I downgrade my plan?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your existing business data isn't deleted if you downgrade. You keep all your clients, projects, quotations and financial records."
          }
        },
        {
          "@type": "Question",
          "name": "Is Kramasha a mobile app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Kramasha is a responsive web application with PWA support and can be installed on supported devices."
          }
        }
      ]
    }
    </script>
