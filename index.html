    <div id="root">
      <!-- Branded splash screen — shown instantly on app launch before React mounts.
           React replaces this content when the app is ready. -->
      <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F5F3EF;z-index:9999;">
        <style>
          @keyframes splash-fade-in {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
          }
          @keyframes splash-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
          }
          #app-splash-logo {
            width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
            animation: splash-fade-in 0.5s ease-out both;
          }
          #app-splash-logo img { width: 100%; height: 100%; object-fit: contain; }
          #app-splash-wordmark {
            margin-top: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: #1A1A1A;
            animation: splash-fade-in 0.5s ease-out 0.1s both;
          }
          #app-splash-subtext {
            margin-top: 6px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.8rem; font-weight: 500; letter-spacing: 0.01em; color: #8A8580;
            animation: splash-fade-in 0.5s ease-out 0.18s both;
          }
          #app-splash-spinner {
            margin-top: 28px; width: 28px; height: 28px;
            border: 3px solid #E8E3DB; border-top-color: #C8A95E;
            border-radius: 50%;
            animation: splash-spin 0.7s linear infinite;
          }
          @keyframes splash-spin { to { transform: rotate(360deg); } }
        </style>
        <div id="app-splash-logo">
          <img src="https://media.base44.com/images/public/6aa198140e2903037c880386/dbb48c566_KramashaLogo.png" alt="Kramasha" />
        </div>
        <div id="app-splash-wordmark">Kramasha</div>
        <div id="app-splash-subtext">Built for creative business</div>
        <div id="app-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Fallback: remove splash screen after 6s even if React fails to mount
         (e.g., build error, network issue) so the user sees the real error. -->
    <script>
      window.setTimeout(function () {
        var s = document.getElementById('app-splash');
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }, 6000);
    </script>
