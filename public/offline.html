<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRAMAS — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f0;
        color: #1a2332;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        background: #1e3a5f;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 32px; height: 32px; color: #fff; }
      h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; color: #64748b; line-height: 1.5; }
      .btn {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.625rem 1.5rem;
        background: #1e3a5f;
        color: #fff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038A5.25 5.25 0 0 1 12 12.75a5.25 5.25 0 0 1 3.712 2.288M5.25 5.625l13.5 13.5M3 3l18 18" />
        </svg>
      </div>
      <h1>You're Offline</h1>
      <p>KRAMAS needs an internet connection to load your workspace. Please check your connection and try again.</p>
      <a href="/" class="btn">Try Again</a>
    </div>
  </body>
</html>
